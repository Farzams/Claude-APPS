name: Build Windows app
on:
  workflow_dispatch:
  push:
    paths: ["pdftoolkit/**", ".github/workflows/build-windows.yml"]
permissions:
  contents: write
concurrency:
  group: build-windows
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r pdftoolkit/requirements.txt
      - name: Get DjVuLibre (bundled so DjVu works with no install)
        shell: pwsh
        run: |
          $env:MSYSTEM = "MINGW64"; $env:CHERE_INVOKING = "1"
          & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-djvulibre
          if (-not (Test-Path C:\msys64\mingw64\bin\ddjvu.exe)) { throw "ddjvu.exe not installed" }
          New-Item -ItemType Directory -Force pdftoolkit/djvu | Out-Null
          Copy-Item C:\msys64\mingw64\bin\ddjvu.exe pdftoolkit/djvu
          $deps = & C:\msys64\usr\bin\bash.exe -lc "ldd /mingw64/bin/ddjvu.exe | grep -i /mingw64/ | sed 's/.*=> //; s/ (.*//'"
          foreach ($d in $deps) {
            $src = "C:\msys64" + $d.Trim().Replace("/", "\")
            if (Test-Path $src) { Copy-Item $src pdftoolkit/djvu -Force }
          }
          Get-ChildItem pdftoolkit/djvu | Select-Object Name, Length
          & pdftoolkit\djvu\ddjvu.exe -help 2>&1 | Select-Object -First 3
          if ($LASTEXITCODE -eq -1073741515) { throw "ddjvu.exe is missing a DLL" }
      - name: Get Ghostscript and OCR language data (bundled)
        shell: pwsh
        run: |
          choco install ghostscript -y --no-progress
          $gsexe = Get-ChildItem "${env:ProgramFiles}\gs" -Recurse -Filter gswin64c.exe -ErrorAction Stop | Select-Object -First 1
          $gsroot = $gsexe.Directory.Parent.FullName
          New-Item -ItemType Directory -Force pdftoolkit/gs | Out-Null
          Copy-Item "$gsroot\*" pdftoolkit/gs -Recurse
          New-Item -ItemType Directory -Force pdftoolkit/tessdata | Out-Null
          foreach ($l in "eng","fas","ara","deu","fra","spa","ita","rus","tur","nld","por","heb","ell","chi_sim","jpn","kor") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata" -OutFile "pdftoolkit/tessdata/$l.traineddata"
          }
          Get-ChildItem pdftoolkit/gs/bin, pdftoolkit/tessdata | Select-Object Name, Length
      # one-folder build: starts instantly (a one-file exe unpacks itself on every launch)
      - run: python -m PyInstaller --noconfirm --onedir --windowed --name PDFToolkit --icon icon.ico --add-data "icon.ico;." --add-data "djvu;djvu" --add-data "gs;gs" --add-data "tessdata;tessdata" --collect-all customtkinter --collect-all pypandoc app.py
        working-directory: pdftoolkit
      - name: Build installer
        working-directory: pdftoolkit
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer.iss
          Compress-Archive -Path dist\PDFToolkit\* -DestinationPath dist\PDFToolkit-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PDFToolkit-windows
          path: |
            pdftoolkit/dist/PDFToolkit-Setup.exe
            pdftoolkit/dist/PDFToolkit-portable.zip
      - name: Remove old single-file asset
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete-asset pdftoolkit-latest PDFToolkit.exe -y --repo ${{ github.repository }}
        continue-on-error: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pdftoolkit-latest
          name: PDF Toolkit (latest Windows build)
          body: "**PDFToolkit-Setup.exe** (recommended: installs, starts fastest) or **PDFToolkit-portable.zip** (unzip anywhere, run PDFToolkit.exe)."
          target_commitish: ${{ github.sha }}
          files: |
            pdftoolkit/dist/PDFToolkit-Setup.exe
            pdftoolkit/dist/PDFToolkit-portable.zip
