name: Build Windows app
on:
  workflow_dispatch:
  push:
    paths: ["pdftoolkit/**", ".github/workflows/build-windows.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r pdftoolkit/requirements.txt
      - name: Get DjVuLibre (bundled so DjVu works with no install)
        shell: pwsh
        run: |
          choco install djvulibre -y --no-progress
          $exe = Get-ChildItem "${env:ProgramFiles}","${env:ProgramFiles(x86)}" -Recurse -Filter ddjvu.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "ddjvu.exe not found after install" }
          New-Item -ItemType Directory -Force pdftoolkit/djvu | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" pdftoolkit/djvu -Recurse
          Get-ChildItem pdftoolkit/djvu
      # one-folder build: starts instantly (a one-file exe unpacks itself on every launch)
      - run: python -m PyInstaller --noconfirm --onedir --windowed --name PDFToolkit --icon icon.ico --add-data "icon.ico;." --add-data "djvu;djvu" --collect-all customtkinter app.py
        working-directory: pdftoolkit
      - name: Build installer
        working-directory: pdftoolkit
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer.iss
          Compress-Archive -Path dist\PDFToolkit\* -DestinationPath dist\PDFToolkit-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PDFToolkit-windows
          path: |
            pdftoolkit/dist/PDFToolkit-Setup.exe
            pdftoolkit/dist/PDFToolkit-portable.zip
      - name: Replace release
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete pdftoolkit-latest --cleanup-tag -y --repo ${{ github.repository }}
        continue-on-error: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pdftoolkit-latest
          name: PDF Toolkit (latest Windows build)
          body: "**PDFToolkit-Setup.exe** (recommended: installs, starts fastest) or **PDFToolkit-portable.zip** (unzip anywhere, run PDFToolkit.exe)."
          target_commitish: ${{ github.sha }}
          files: |
            pdftoolkit/dist/PDFToolkit-Setup.exe
            pdftoolkit/dist/PDFToolkit-portable.zip
