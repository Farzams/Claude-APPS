name: Build Windows app
on:
  workflow_dispatch:
  push:
    paths: ["pdftoolkit/**", ".github/workflows/build-windows.yml"]
permissions:
  contents: write
concurrency:
  group: build-windows
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r pdftoolkit/requirements.txt
      - name: Get DjVuLibre (bundled so DjVu works with no install)
        shell: pwsh
        run: |
          $env:MSYSTEM = "MINGW64"; $env:CHERE_INVOKING = "1"
          & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-djvulibre
          if (-not (Test-Path C:\msys64\mingw64\bin\ddjvu.exe)) { throw "ddjvu.exe not installed" }
          New-Item -ItemType Directory -Force pdftoolkit/djvu | Out-Null
          Copy-Item C:\msys64\mingw64\bin\ddjvu.exe pdftoolkit/djvu
          $deps = & C:\msys64\usr\bin\bash.exe -lc "ldd /mingw64/bin/ddjvu.exe | grep -i /mingw64/ | sed 's/.*=> //; s/ (.*//'"
          foreach ($d in $deps) {
            $src = "C:\msys64" + $d.Trim().Replace("/", "\")
            if (Test-Path $src) { Copy-Item $src pdftoolkit/djvu -Force }
          }
          Get-ChildItem pdftoolkit/djvu | Select-Object Name, Length
          & pdftoolkit\djvu\ddjvu.exe -help 2>&1 | Select-Object -First 3
          if ($LASTEXITCODE -eq -1073741515) { throw "ddjvu.exe is missing a DLL" }
      - name: Get Ghostscript, Tesseract and OCR language data (bundled)
        shell: pwsh
        run: |
          choco install ghostscript tesseract -y --no-progress
          $gsexe = Get-ChildItem "${env:ProgramFiles}\gs" -Recurse -Filter gswin64c.exe -ErrorAction Stop | Select-Object -First 1
          New-Item -ItemType Directory -Force pdftoolkit/gs | Out-Null
          Copy-Item "$($gsexe.Directory.Parent.FullName)\*" pdftoolkit/gs -Recurse
          $tess = "${env:ProgramFiles}\Tesseract-OCR"
          if (-not (Test-Path "$tess\tesseract.exe")) { throw "tesseract.exe not found at $tess" }
          New-Item -ItemType Directory -Force pdftoolkit/tesseract | Out-Null
          Copy-Item "$tess\*" pdftoolkit/tesseract -Recurse
          # best-quality models for Persian and Arabic
          foreach ($l in "fas","ara") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata" -OutFile "pdftoolkit/tesseract/tessdata/$l.traineddata"
          }
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "pdftoolkit/tesseract/tessdata/eng.traineddata"
          # only English, Persian and Arabic are kept (plus orientation data)
          Get-ChildItem pdftoolkit/tesseract/tessdata -Filter *.traineddata | Where-Object { $_.BaseName -notin "eng","fas","ara","osd" } | Remove-Item -Force
          Get-ChildItem pdftoolkit/gs/bin | Select-Object -First 5 Name
          Get-ChildItem pdftoolkit/tesseract/tessdata | Select-Object Name, Length
      - name: Smoke test bundled tools (OCR, Ghostscript, PDF tools)
        shell: pwsh
        timeout-minutes: 30
        env: { PYTHONUTF8: "1" }
        run: python pdftoolkit/smoke_test.py
      - name: GUI smoke test (Qt window), English and Persian (does not block the build)
        shell: pwsh
        continue-on-error: true
        env: { PYTHONUTF8: "1" }
        run: |
          python pdftoolkit/gui_smoke.py en
          python pdftoolkit/gui_smoke.py fa
      # one-folder build: starts instantly (a one-file exe unpacks itself on every launch)
      - run: python -m PyInstaller --noconfirm --onedir --windowed --name PDFToolkit --icon icon.ico --add-data "icon.ico;." --add-data "fonts;fonts" --add-data "djvu;djvu" --add-data "gs;gs" --add-data "tesseract;tesseract" --collect-all docx --collect-all bidi --collect-all pdf2docx --hidden-import PySide6.QtSvg --hidden-import openpyxl --hidden-import fitz --hidden-import pikepdf --hidden-import cv2 --exclude-module tkinter --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets app.py
        working-directory: pdftoolkit
      - name: Check the packaged program (OpenCV, PDF repair, Word export, Excel, icons, OCR languages)
        working-directory: pdftoolkit
        shell: pwsh
        env: { PYTHONUTF8: "1" }
        run: |
          $p = Start-Process -FilePath "dist\PDFToolkit\PDFToolkit.exe" -ArgumentList "--selftest","$PWD\selftest.json" -PassThru -Wait
          Write-Host "exit code $($p.ExitCode)"
          if (Test-Path selftest.json) { Get-Content selftest.json } else { Write-Host "no result file" }
          if ($p.ExitCode -ne 0) { throw "the packaged program failed its self-test" }
      - name: Build installer
        working-directory: pdftoolkit
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer.iss
          Compress-Archive -Path dist\PDFToolkit\* -DestinationPath dist\PDFToolkit-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PDFToolkit-windows
          path: |
            pdftoolkit/dist/PDFToolkit-Setup.exe
            pdftoolkit/dist/PDFToolkit-portable.zip
      - name: Publish release (with retries)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $repo = "${{ github.repository }}"; $tag = "pdftoolkit-latest"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "PDF Toolkit (latest Windows build)" --target "${{ github.sha }}" --notes "**PDFToolkit-Setup.exe** (recommended: installs, starts fastest) or **PDFToolkit-portable.zip** (unzip anywhere, run PDFToolkit.exe)."
          }
          gh release delete-asset $tag PDFToolkit.exe -y --repo $repo *> $null
          foreach ($f in "pdftoolkit/dist/PDFToolkit-Setup.exe", "pdftoolkit/dist/PDFToolkit-portable.zip") {
            $ok = $false
            foreach ($i in 1..5) {
              gh release upload $tag $f --clobber --repo $repo
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "Upload of $f failed (attempt $i), retrying..."
              Start-Sleep -Seconds (10 * $i)
            }
            if (-not $ok) { throw "Could not upload $f" }
          }
          gh release view $tag --repo $repo --json assets --jq ".assets[] | [.name, .size] | @tsv"
