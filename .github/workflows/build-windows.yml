name: Build Windows exe
on:
  workflow_dispatch:
  push:
    paths: ["pdftoolkit/**"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r pdftoolkit/requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name PDFToolkit app.py
        working-directory: pdftoolkit
      - uses: actions/upload-artifact@v4
        with: { name: PDFToolkit-windows, path: pdftoolkit/dist/PDFToolkit.exe }
