name: Build add-on packs
# Builds the optional downloads (Settings > Add-ons) and publishes them in the release "pdftoolkit-addons".
# Run it by hand (Actions > Build add-on packs > Run workflow). The app reads addons.json from that release.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/addons.yml", "pdftoolkit/addon_tools/**", "pdftoolkit/formula_ocr.py"]
permissions:
  contents: write
concurrency:
  group: build-addons
  cancel-in-progress: false
jobs:
  formula-ocr:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the Formula OCR pack (ONNX Runtime + tokenizers + models)
        shell: pwsh
        run: |
          python -m pip install numpy pillow opencv-python-headless matplotlib
          New-Item -ItemType Directory -Force pack/lib, pack/models | Out-Null
          python -m pip install --no-deps --target pack/lib onnxruntime tokenizers
          foreach ($f in "image_resizer.onnx","encoder.onnx","decoder.onnx","tokenizer.json") {
            Invoke-WebRequest "https://github.com/RapidAI/RapidLaTeXOCR/releases/download/v0.0.0/$f" -OutFile "pack/models/$f"
          }
          Copy-Item pdftoolkit/addon_tools/LICENSES-formula-ocr.txt pack/
          Get-ChildItem pack/models | Select-Object Name, Length
          python pdftoolkit/addon_tools/test_formula_ocr.py pack
          python -c "import zipfile, pathlib; z = zipfile.ZipFile('formula-ocr-win64.zip', 'w', zipfile.ZIP_DEFLATED); [z.write(p, p.relative_to('pack').as_posix()) for p in sorted(pathlib.Path('pack').rglob('*')) if p.is_file()]; z.close()"
          Get-Item formula-ocr-win64.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: formula-ocr, path: formula-ocr-win64.zip }
  tex-full:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pymupdf
      - name: Get Tectonic
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          New-Item -ItemType Directory -Force tecdl, pdftoolkit/tectonic | Out-Null
          gh release download --repo tectonic-typesetting/tectonic --pattern "*x86_64-pc-windows-msvc.zip" --dir tecdl
          Expand-Archive (Get-ChildItem tecdl/*.zip | Select-Object -First 1).FullName pdftoolkit/tectonic -Force
          & pdftoolkit/tectonic/tectonic.exe --version
      - name: Fill the caches (base set, then the full set) and diff them
        shell: pwsh
        env: { PYTHONUTF8: "1" }
        run: |
          python pdftoolkit/addon_tools/warm_tex.py "$PWD\cache_base" base report-base.json
          Copy-Item cache_base cache_full -Recurse
          python pdftoolkit/addon_tools/warm_tex.py "$PWD\cache_full" full report-full.json
          python pdftoolkit/addon_tools/make_pack.py cache_base cache_full tex-full.zip
      - name: Check that the pack really works offline (cache = base + pack, Tectonic told to use only cached files)
        shell: pwsh
        run: |
          $help = & pdftoolkit/tectonic/tectonic.exe -X compile --help | Out-String
          if ($help -notmatch "only-cached") { Write-Host "this Tectonic has no --only-cached option: offline check skipped"; Get-Item tex-full.zip | Select-Object Name, Length; exit 0 }
          Copy-Item cache_base cache_user -Recurse
          Expand-Archive tex-full.zip cache_user -Force
          $env:TECTONIC_CACHE_DIR = "$PWD\cache_user"
          $ok = (Get-Content report-full.json | ConvertFrom-Json).ok
          $sample = $ok | Where-Object { $_ -notlike "class *" -and $_ -notlike "beamer *" -and $_ -notlike "font *" -and $_ -notlike "bibtex *" } | Select-Object -First 40
          $fail = 0
          New-Item -ItemType Directory -Force offline | Out-Null
          foreach ($p in $sample) {
            Set-Content offline/o.tex "\documentclass{article}\usepackage{$p}\begin{document}x\end{document}"
            & pdftoolkit/tectonic/tectonic.exe -X compile --only-cached --outdir offline offline/o.tex *> $null
            if ($LASTEXITCODE -ne 0) { $fail++; Write-Host "OFFLINE FAIL $p" }
          }
          Write-Host "offline check: $fail of $($sample.Count) failed"
          if ($fail -gt ($sample.Count * 0.15)) { throw "too many packages are missing from the pack" }
          Get-Item tex-full.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: tex-full, path: tex-full.zip }
  publish:
    needs: [formula-ocr, tex-full]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { path: packs }
      - name: Publish the release pdftoolkit-addons (with retries)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $repo = "${{ github.repository }}"; $tag = "pdftoolkit-addons"
          $base = "https://github.com/$repo/releases/download/$tag"
          python pdftoolkit/addon_tools/make_addons_json.py addons.json $base "formula-ocr=packs/formula-ocr/formula-ocr-win64.zip" "tex-full=packs/tex-full/tex-full.zip"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "PDF Toolkit add-ons" --notes "Optional downloads for PDF Toolkit (Settings > Add-ons). The app reads addons.json from here."
          }
          foreach ($f in "addons.json","packs/formula-ocr/formula-ocr-win64.zip","packs/tex-full/tex-full.zip") {
            $ok = $false
            foreach ($i in 1..5) {
              gh release upload $tag $f --clobber --repo $repo
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds (10 * $i)
            }
            if (-not $ok) { throw "upload of $f failed" }
          }
