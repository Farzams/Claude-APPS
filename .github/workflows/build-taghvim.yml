name: Build Taghvim (Persian calendar widgets)
# Tests the calendar core on the JVM and builds the Android app (month and prayer-time widgets).
# Publishes the APK in the release "taghvim-latest".
on:
  workflow_dispatch:
  push:
    paths: ["taghvim/**", ".github/workflows/build-taghvim.yml"]
permissions:
  contents: write
concurrency:
  group: build-taghvim
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: wrapper }
      - name: Test the calendar core (Jalali and Hijri dates, holidays, prayer times)
        working-directory: taghvim
        run: ./gradlew --no-daemon :core:test
      - name: Build the APK
        working-directory: taghvim
        env: { APP_VERSION_CODE: "${{ github.run_number }}" }
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: taghvim-apk
          path: taghvim/app/build/outputs/apk/debug/*.apk
      - name: Publish the APK (release taghvim-latest)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          repo="${{ github.repository }}"; tag="taghvim-latest"
          apk=$(find taghvim/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$apk" Taghvim.apk
          gh release view $tag --repo $repo >/dev/null 2>&1 || gh release create $tag --repo $repo --title "Taghvim for Android (latest build)" --target "${{ github.sha }}" --notes "Persian calendar widgets: month with holidays (4x4) and prayer times (4x1). Install Taghvim.apk and add the widgets from the home screen."
          for i in 1 2 3 4 5; do gh release upload $tag Taghvim.apk --clobber --repo $repo && break; sleep $((10*i)); done

  widgets-test:
    # Draws both widgets in an emulator, saves pictures of them and checks the texts the design needs.
    # The APK above is already published; this job tells whether the widgets really look right.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: wrapper }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render the widgets in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env: { APP_VERSION_CODE: "${{ github.run_number }}" }
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash taghvim/tools/ci_emulator.sh
      - name: Publish the pictures to the branch taghvim-ci-shots
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p /tmp/pub
          cp -r shots /tmp/pub/ 2>/dev/null || true
          cp test_exit.txt files.txt pull.txt gradle_test.log logcat.txt /tmp/pub/ 2>/dev/null || true
          find taghvim/app/build/reports/androidTests -name "*.html" -o -name "*.txt" 2>/dev/null | head -5 | xargs -I{} cp {} /tmp/pub/ 2>/dev/null || true
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > /tmp/pub/RUN.txt
          cd /tmp/pub
          git init -q
          git checkout -q -b taghvim-ci-shots
          git add -A
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -q -m "Taghvim widget pictures for run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" taghvim-ci-shots
      - name: Fail when the widget test failed
        run: test "$(cat test_exit.txt 2>/dev/null || echo 1)" = "0"
